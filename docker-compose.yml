services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: ecomkit-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ecomkit-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ecomkit-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001/api}
      QUEUE_BATCH_PROCESSING_NAME: ${QUEUE_BATCH_PROCESSING_NAME:-batch-processing}
      INTERNAL_API_TIMEOUT_MS: ${INTERNAL_API_TIMEOUT_MS:-30000}
      WORKER_INTERNAL_API_KEY: ${WORKER_INTERNAL_API_KEY}
      UPLOAD_STORAGE_ROOT: ${UPLOAD_STORAGE_ROOT}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB}
      UPLOAD_MAX_FILES_PER_BATCH: ${UPLOAD_MAX_FILES_PER_BATCH}
    ports:
      - "${API_PORT}:3001"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - ecomkit-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ecomkit-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001/api}
      QUEUE_BATCH_PROCESSING_NAME: ${QUEUE_BATCH_PROCESSING_NAME:-batch-processing}
      INTERNAL_API_TIMEOUT_MS: ${INTERNAL_API_TIMEOUT_MS:-30000}
      WORKER_INTERNAL_API_KEY: ${WORKER_INTERNAL_API_KEY}
      UPLOAD_STORAGE_ROOT: ${UPLOAD_STORAGE_ROOT}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    networks:
      - ecomkit-network

  postgres:
    image: postgres:16-alpine
    container_name: ecomkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ecomkit-postgres-data:/var/lib/postgresql/data
    networks:
      - ecomkit-network

  redis:
    image: redis:7-alpine
    container_name: ecomkit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - ecomkit-redis-data:/data
    networks:
      - ecomkit-network

volumes:
  ecomkit-postgres-data:
    name: ecomkit-postgres-data
  ecomkit-redis-data:
    name: ecomkit-redis-data

networks:
  ecomkit-network:
    name: ecomkit-network
    driver: bridge
